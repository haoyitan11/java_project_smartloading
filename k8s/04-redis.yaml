apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: smartloading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartloading-secrets
                  key: REDIS_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              redis-server --requirepass "$REDIS_PASSWORD"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: smartloading
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
