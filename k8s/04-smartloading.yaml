apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartloading
  namespace: smartloading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartloading
  template:
    metadata:
      labels:
        app: smartloading
    spec:
      containers:
        - name: smartloading
          image: smartloading:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Use Spring profile for k8s or local
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"  # Use k8s profile if running in Kubernetes

            # PostgreSQL connection settings
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.smartloading.svc.cluster.local:5432/mydb"  # Connect to PostgreSQL StatefulSet service
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartloading-secrets
                  key: POSTGRES_PASSWORD

            # Redis connection settings for k8s
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"  # Redis StatefulSet service
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartloading-secrets
                  key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: smartloading
  namespace: smartloading
spec:
  type: NodePort
  selector:
    app: smartloading
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
