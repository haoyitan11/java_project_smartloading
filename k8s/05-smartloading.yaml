apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartloading
  namespace: smartloading
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartloading
  template:
    metadata:
      labels:
        app: smartloading
    spec:
      containers:
        - name: smartloading
          image: smartloading:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # PostgreSQL in kubernetes
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/mydb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartloading-secrets
                  key: POSTGRES_PASSWORD

            # Redis in kubernetes
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartloading-secrets
                  key: REDIS_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: smartloading
  namespace: smartloading
spec:
  type: NodePort
  selector:
    app: smartloading
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
