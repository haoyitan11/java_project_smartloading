# Spring application name
spring.application.name=smartloading

# DataSource (PostgreSQL in Kubernetes)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/mydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password123}

# Hibernate and JPA settings for Kubernetes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf settings (same as local)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Redis Configuration (Kubernetes)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:user123}
spring.data.redis.timeout=2s

# Enable caching with Redis in Kubernetes
spring.cache.type=redis
