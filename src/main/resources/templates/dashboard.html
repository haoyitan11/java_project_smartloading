<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dashboard | Smart Loading</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
        }
        .product-card {
            border-radius: 12px;
            padding: 15px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: white;
            border: 1px solid #ddd;
        }
        .product-img {
            height: 220px;
            object-fit: contain;
            border-radius: 10px;
            background: #ffffff;
        }
        .heart {
            cursor: pointer;
            font-size: 22px;
            user-select: none;
            transition: 0.15s ease;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark px-3">
    <div class="container-fluid d-flex justify-content-between align-items-center">

        <a class="navbar-brand fw-bold">Smart Loading System</a>

        <div class="d-flex gap-2">
            <a href="/products" class="btn btn-sm btn-light">All Products</a>

            <a href="/decision-tree" class="btn btn-sm btn-warning">
                Decision Tree Result
            </a>

            <a href="/logout" class="btn btn-sm btn-danger">Logout</a>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container mt-4">

    <!-- HEADER -->
    <div class="text-center mb-5">
        <h2 class="fw-bold">Recommended For You</h2>

        <p class="text-muted">
            Based on your behavior — Recommended Category:
            <span class="badge bg-primary" th:text="${recommendedCategory}"></span>
        </p>
    </div>

    <!-- ====================== -->
    <!-- FINAL TOP 5 PRODUCTS   -->
    <!-- ====================== -->
    <h4 class="fw-bold">Top 5 Recommended Products</h4>
    <div class="row g-4 mt-2">

        <div class="col-md-3" th:each="p : ${finalProducts}">
            <div class="card shadow-sm product-card">

                <img th:src="${p.imageUrl}" class="product-img">

                <h6 class="mt-3 fw-bold" th:text="${p.productName}"></h6>
                <small class="text-muted" th:text="${p.category}"></small>

                <strong class="text-primary mt-2"
                        th:text="'RM ' + ${p.price}"></strong>

                <!-- LIKE BUTTON -->
                <div class="d-flex align-items-center mt-3">

                    <!-- heart icon -->
                    <span class="heart"
                          th:attr="data-product-id=${p.productId}"
                          th:text="${userLikes[p.productId]} ? '❤' : '🤍'"
                          th:classappend="${userLikes[p.productId]} ? ' text-danger' : ' text-secondary'"
                          onclick="toggleLike(this)">
                    </span>

                    <!-- like counter -->
                    <span class="ms-2"
                          th:attr="id=${'likes-' + p.productId}"
                          th:text="${likeText[p.productId]}">
                    </span>
                </div>

                <!-- VIEW DETAILS BUTTON -->
                <button class="btn btn-dark btn-sm mt-3"
                        th:attr="data-product-id=${p.productId}"
                        onclick="recordUserClick(this)">
                    View Details
                </button>

            </div>
        </div>

    </div>

    <!-- STEPS (OPTIONAL DEBUGGING) -->
    <div class="mt-5">
        <h5 class="fw-bold">Decision Steps (Debug Info)</h5>
        <ul class="list-group">
            <li class="list-group-item"
                th:each="s : ${steps}"
                th:text="${s}"></li>
        </ul>
    </div>

</div>

<!-- JS -->
<script>

    function recordUserClick(btn) {
        const productId = btn.getAttribute("data-product-id");

        fetch("/api/behavior/click", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "productId=" + encodeURIComponent(productId)
        });
    }

    function toggleLike(heart) {

        const productId = heart.getAttribute("data-product-id");

        fetch("/api/likes/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "productId=" + encodeURIComponent(productId)
        })
        .then(res => res.json())
        .then(data => {

            if (data.error) {
                alert("Please login first.");
                return;
            }

            // Update Heart Icon
            if (data.liked) {
                heart.textContent = "❤";
                heart.classList.add("text-danger");
                heart.classList.remove("text-secondary");
            } else {
                heart.textContent = "🤍";
                heart.classList.add("text-secondary");
                heart.classList.remove("text-danger");
            }

            // Update Like Count
            const cnt = document.getElementById("likes-" + productId);
            cnt.textContent = data.totalLikes + " likes";
        })
        .catch(err => console.error("LIKE ERROR:", err));
    }

</script>

</body>
</html>
