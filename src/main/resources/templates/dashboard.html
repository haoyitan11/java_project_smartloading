<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Dashboard | Smart Loading</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body { background: #f5f7fa; }

        .page-wrap { max-width: 1250px; margin: 0 auto; }

        /* header */
        .header-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 24px 22px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        /* product fixed size */
        .product-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 14px;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: 0.12s ease;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.10);
        }

        .product-img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            background: #ffffff;
            border-radius: 10px;
        }

        .heart {
            font-size: 22px;
            cursor: pointer;
            user-select: none;
            transition: 0.15s ease;
        }

        .category-panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid #e2e8f0;
            margin-bottom: 30px;
        }

        .category-chip {
            background: #f1f5f9;
            border-radius: 999px;
            padding: 5px 12px;
            border: 1px solid #d6dee6;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            gap: 6px;
        }

        .count {
            background: #334155;
            color: #fff;
            padding: 1px 7px;
            font-size: 0.8rem;
            border-radius: 50px;
        }
    </style>
</head>

<body>

<!-- navigation bar -->
<nav class="navbar navbar-dark bg-dark px-3">
    <div class="container-fluid d-flex justify-content-between">
        <span class="navbar-brand fw-bold">Smart Loading System</span>

        <div class="d-flex gap-2">
            <a href="/products" class="btn btn-sm btn-light">All Products</a>
            <a href="/decision-tree" class="btn btn-sm btn-warning">Decision Tree</a>
            <a href="/logout" class="btn btn-sm btn-danger">Logout</a>
        </div>
    </div>
</nav>


<div class="container mt-4 page-wrap">

    <!-- header section -->
    <div class="header-card text-center mb-4">
        <h2 class="fw-bold mb-1">Recommended For You</h2>
        <p class="text-muted small mb-1">15 products selected by decision-tree AI</p>

        <div th:if="${top3Categories != null}">
            <span class="text-muted">Top 3 categories: </span>
            <span class="fw-bold text-dark" th:text="${#strings.listJoin(top3Categories, ', ')}"></span>
        </div>
    </div>

    <!-- categories grid -->
    <div class="category-panel">
        <div class="d-flex justify-content-between mb-3">
            <h6 class="fw-bold m-0">Category Breakdown (Final 15)</h6>
            <small class="text-muted">products per category</small>
        </div>

        <div class="d-flex flex-wrap gap-2">
            <div th:each="entry : ${categoryCount.entrySet()}" class="category-chip">
                <span th:text="${entry.key}"></span>
                <span class="count" th:text="${entry.value}"></span>
            </div>
        </div>
    </div>

    <!-- product grid -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold m-0">Recommended Products</h4>
        <small class="text-muted">Based on decision-tree scoring</small>
    </div>

    <div class="row g-4">

        <div class="col-6 col-md-4 col-lg-3 col-xl-2" th:each="p : ${finalProducts}">
            <div class="product-card">

                <img th:src="${p.imageUrl}" class="product-img" alt="Product" />

                <h6 class="fw-bold mt-3 text-truncate" th:text="${p.productName}"></h6>
                <small class="text-muted" th:text="${p.category}"></small>

                <div class="fw-bold text-primary mt-2" th:text="'RM ' + ${p.price}"></div>

                <!-- like heart -->
                <div class="d-flex align-items-center mt-3">
                    <span class="heart"
                          th:attr="data-product-id=${p.productId},data-liked=${userLikes[p.productId]}"
                          onclick="toggleLike(this)">🤍</span>

                    <span class="ms-2"
                          th:attr="id=${'likes-' + p.productId}"
                          th:text="${likeText[p.productId]}"></span>
                </div>

                <button class="btn btn-dark btn-sm mt-3"
                        th:attr="data-product-id=${p.productId}"
                        onclick="recordUserClick(this)">
                    View Details
                </button>

            </div>
        </div>

    </div>
</div>


<!-- javascript -->
<script>
    /* INITIALIZE HEARTS */
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".heart").forEach(h => {
            const liked = h.getAttribute("data-liked") === "true";
            h.textContent = liked ? "❤" : "🤍";
            h.classList.add(liked ? "text-danger" : "text-secondary");
        });
    });

    function recordUserClick(btn) {
        const id = btn.getAttribute("data-product-id");
        fetch("/api/behavior/click", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: "productId=" + encodeURIComponent(id)
        });
    }

    function toggleLike(heart) {
        const id = heart.getAttribute("data-product-id");

        fetch("/api/likes/toggle", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded"},
            body: "productId=" + encodeURIComponent(id)
        })
        .then(res => res.json())
        .then(data => {
            if (data.error) { alert("Please login first."); return; }

            heart.setAttribute("data-liked", data.liked);

            if (data.liked) {
                heart.textContent = "❤";
                heart.classList.add("text-danger");
                heart.classList.remove("text-secondary");
            } else {
                heart.textContent = "🤍";
                heart.classList.add("text-secondary");
                heart.classList.remove("text-danger");
            }

            document.getElementById("likes-" + id).textContent =
                data.totalLikes + " likes";
        });
    }
</script>

</body>
</html>
