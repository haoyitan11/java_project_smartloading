<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Lazy Loading System</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .login-card {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4 login-card" style="width: 380px;">

        <h3 class="text-center mb-4 fw-bold">Smart Loading Login</h3>

        <!-- login form -->
        <form th:action="@{/login}" method="post">

            <!-- username -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text"
                       class="form-control"
                       name="username"
                       placeholder="Enter username"
                       required>
            </div>

            <!-- password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password"
                       class="form-control"
                       name="password"
                       placeholder="Enter password"
                       required>
            </div>

            <!-- error message -->
            <div th:if="${errorMessage}" class="alert alert-danger text-center py-2">
                <span th:text="${errorMessage}"></span>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>

        </form>

    </div>

</div>

</body>
</html>
