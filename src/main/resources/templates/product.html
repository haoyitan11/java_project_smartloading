<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>All Products | Smart Loading</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background:#eef2f7; }

    .page-wrap { max-width: 1200px; margin: 0 auto; }

    .category-header{
        display:flex; align-items:center; justify-content:space-between;
        margin-top:28px; margin-bottom:10px;
    }

    .category-title{
        font-size:1.35rem; font-weight:800; text-transform:capitalize;
    }

    .chip {
        background:#f1f5f9;
        border:1px solid #dbe2ea;
        padding:2px 8px;
        font-size:0.8rem;
        font-weight:700;
        border-radius:999px;
        color:#111827;
        display:inline-block;
    }

    .product-card {
        background: white;
        border: 1px solid #dde3ea;
        border-radius: 12px;
        padding: 14px;
        height: 100%;
        display:flex;
        flex-direction:column;
        transition: 0.15s ease;
    }

    .product-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .product-img {
        height: 170px;
        object-fit: contain;
        background:#fff;
        border-radius:10px;
    }

    .like-btn {
        cursor:pointer;
        font-size:22px;
        user-select:none;
        transition:.1s;
    }

    .desc {
        font-size: 0.9rem;
        color:#6c757d;
        min-height: 40px;
    }

    .price {
        font-weight:800;
    }
  </style>
</head>

<body>

<!-- navigation bar -->
<nav class="navbar navbar-dark bg-dark px-3">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold">Smart Loading System</a>
    <div class="d-flex gap-2">
      <a href="/dashboard" class="btn btn-sm btn-light">Dashboard</a>
      <a href="/decision-tree" class="btn btn-sm btn-warning">Decision Tree Result</a>
      <a href="/logout" class="btn btn-sm btn-danger">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4 page-wrap">

  <!-- header -->
  <div class="text-center mb-4">
    <h2 class="fw-bold">All Products</h2>
    <p class="text-muted">Browse the full catalog by category</p>
  </div>

  <!-- loop categories -->
  <div th:each="entry : ${categoryMap}">

    <!-- category header -->
    <div class="category-header">
      <div>
        <span class="category-title" th:text="${entry.key}">Category</span>
        <span class="chip ms-2"
              th:text="${#lists.size(entry.value)} + ' items'">0 items</span>
      </div>
    </div>

    <!-- product grid (max 5) -->
    <div class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-4">

      <div class="col" th:each="p : ${entry.value}">
        <div class="product-card h-100">

          <img th:src="${p['imageUrl']}" class="product-img" alt="Product image">

          <h6 class="mt-3 fw-bold text-truncate"
              th:text="${p['productName']}">
            Product name
          </h6>

          <small class="text-muted fw-semibold"
                 th:text="${p['category']}">Category</small>

          <div class="desc mt-1"
               th:text="${#strings.abbreviate(p['description'], 80)}">
            description...
          </div>

          <div class="price text-primary mt-auto"
               th:text="'RM ' + ${p['price']}">
            RM 0.00
          </div>

          <!-- like + count -->
          <div class="mt-2 d-flex align-items-center gap-2">
            <span class="like-btn"
                  th:attr="data-product-id=${p['productId']}"
                  th:classappend="${p['likedByUser']} ? ' text-danger' : ' text-secondary'"
                  th:text="${p['likedByUser']} ? '❤' : '🤍'"
                  onclick="toggleLike(this)">
            </span>

            <small th:id="'likes-' + ${p['productId']}"
                   th:text="${p['likes']} + ' likes'">
              0 likes
            </small>
          </div>

          <!-- view details -->
          <button class="btn btn-dark btn-sm mt-2"
                  th:attr="data-product-id=${p['productId']}"
                  onclick="recordUserClick(this)">
            View Details
          </button>

        </div>
      </div>

    </div>

    <hr class="my-4">

  </div>
</div>

<script>
  //record user click
  function recordUserClick(btn) {
      const productId = btn.getAttribute("data-product-id");

      fetch("/api/behavior/click", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "productId=" + encodeURIComponent(productId)
      });
  }

  //like feature
  function toggleLike(el) {
      const productId = el.getAttribute("data-product-id");

      fetch("/api/likes/toggle", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "productId=" + encodeURIComponent(productId)
      })
      .then(res => res.json())
      .then(data => {
          if (data.error) {
              alert("Please login to like items.");
              return;
          }

          if (data.liked) {
              el.innerText = "❤";
              el.className = "like-btn text-danger";
          } else {
              el.innerText = "🤍";
              el.className = "like-btn text-secondary";
          }

          const likeCount = document.getElementById("likes-" + productId);
          likeCount.innerText = data.totalLikes + " likes";
      })
      .catch(err => console.error("Like error:", err));
  }
</script>

</body>
</html>
